name: medelyra
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  package_info_plus: ^4.0.0

  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  
  flutter_local_notifications: 19.5.0
  timezone: 0.10.1
  flutter_timezone: ^4.1.1

  shared_preferences: ^2.5.3
  
  google_maps_flutter: 2.10.1
  geolocator: ^13.0.4
  http: ^1.5.0

  flutter_google_places_sdk: 0.4.2+1
  url_launcher: ^6.3.1
  google_sign_in: 6.2.2

  flutter_native_splash: ^2.4.1


dependency_overrides:
  geolocator_android: 4.6.1  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/google.png
    - assets/facebook.png
    - assets/pillReminder.png
    - assets/appointmentReminder.png
    - assets/medelyraLogo.png
    - assets/medelyraIcon.png
    - assets/medelyraIconSplash.png
    - assets/medelyraIconLauncher.png 


flutter_native_splash:
  color: "#FAF9FC"
  image: assets/medelyraIcon.png

  android_12:
    color: "#FAF9FC"
    image: assets/medelyraSplashFull.png


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/medelyraIconLauncher.png"
  adaptive_icon_background: "#FAF9FC"
  adaptive_icon_foreground: "assets/medelyraIconLauncher.png"